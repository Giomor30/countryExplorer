<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countries Info</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="header-modern">
    <div class="container">
      <div class="header-content">
        <h1 class="header-title">🌍 World Countries Explorer</h1>
        <p class="header-subtitle">Descubre información detallada sobre países de todo el mundo</p>
      </div>
    </div>
  </header>

  <!-- Buscador -->
  <section class="search-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="search-wrapper">
            <input id="searchInput" type="text" class="form-control search-input" placeholder="🔍 Buscar por país, capital, región..." />
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Contenedor de países -->
  <main class="container">
    <div id="countriesContainer" class="row g-4 justify-content-center">
      <!-- Aquí se generarán las cards dinámicamente -->
    </div>
  </main>

  <!-- Modal Clima -->
  <div class="modal fade" id="weatherModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="weatherModalTitle">Clima</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="weatherModalBody">
          Cargando clima...
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-modern">
    <div class="container">
      <div class="footer-content">
        <p class="footer-text">Desarrollado con ❤️ por <strong>Gio</strong></p>
        <p class="footer-credit">Datos proporcionados por REST Countries API & OpenWeather</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
