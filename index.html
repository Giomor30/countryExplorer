<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countries Info</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="bg-primary text-white text-center p-3">
    <h1>🌍🏙️🏳️ World Countries </h1>
    <p class="lead">Explora información de los paises del mundo</p>
  </header>

  <!-- Buscador -->
  <section class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <input id="searchInput" type="text" class="form-control" placeholder="Buscar país..." />
      </div>
    </div>
  </section>

  <!-- Contenedor de países -->
  <main class="container">
    <div id="countriesContainer" class="row g-4 justify-content-center">
      <!-- Aquí se generarán las cards dinámicamente -->
    </div>
  </main>

  <!-- Modal Clima -->
  <div class="modal fade" id="weatherModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="weatherModalTitle">Clima</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="weatherModalBody">
          Cargando clima...
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-muted py-3 mt-5">
    <small>Desarrollado por Gio </small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
